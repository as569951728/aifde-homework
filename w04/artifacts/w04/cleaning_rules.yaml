contract_version: w04-0.1.0
data_version: qinghe-w04-v1.1
tag_cleaning:
  delimiters:
  - ','
  - ，
  - ;
  - ；
  legal_tags_source: customer/w04/member_tags.csv
  hyphenated_tag_handling: 先整词匹配合法标签，命中即完整保留，绝不按连字符切分：母婴-0到3岁、母婴-3到6岁 是标签名本身（分别 5,566／5,257 人）；同形态的 勿发短信-投诉过 属备注，同样不按连字符切。依据：小林
    MSG-05253「连字符属于标签名本身」＋数据自证两种形态并存
  unknown_tag_handling: 16 个正式标签识别后，剩余备注按原始顺序整条保留，不按内部逗号、分号、斜杠或空格切碎；raw_text 保留完整原格。
  note_extraction: 每条原始记录先按16词表识别标签，再将剩余备注作为一条 note_text，内部逗号原样保留（小林 MSG-05263）。只清除外围分隔符残渣。触达限制须包含勿打电话或勿发短信；仅保留到店服务、不方便接听单独出现时效力待核，不自行升级。source_file/source_row/source_field/raw_text
    完整保留。混写边界仍待核，整格原文为复核依据。
invalid_values:
- source_fields:
  - stop_dt
  values:
  - ''
  - 'NULL'
  - '-'
  - 无
  action: null_out
  reason: 合同缺失标记。数据自证：stop_dt 空 10,301／NULL 4,441／'-' 965／'无' 47，合计 15,754 条缺失，仅 894 条为真实提前终止日期；若把四种写法当日期解析，导入器第 51–53 行的
    CSV 列校验会直接失败
- source_fields:
  - tag
  values:
  - ''
  - 'NULL'
  - '-'
  - 无
  action: null_out
  reason: 整格四种缺失标记不产生标签或备注；纯标签分隔残渣也不产生备注。剩余有意义文字整条保留。
- source_fields:
  - birth
  - reg_dev
  - nm
  values:
  - ''
  - 'NULL'
  - '-'
  - 无
  action: null_out_and_drop
  reason: 转为空值（NULL），且三列均不落库、仅用于诊断报告计数。数据自证：birth 缺 21,161（NULL 6,222／'-' 1,975／'无' 243／空 12,721）、nm 缺 5,700（NULL 888／'-'
    112／'无' 521／空 4,179）、reg_dev 缺 39,917（恰等于 src_ch='系统导入' 的 39,917，全部重合）。契约 members.csv 只接受 7 列，多一列即 CSV_COLUMNS_MISMATCH，故三列不落库
abnormal_records:
- rule_id: orphan_order
  condition: 订单的 hy_id 在 crm_member_export.csv 中不存在（会员号无法关联）
  action: quarantine
  reason_code: UNLINKED_ACCOUNT
  evidence: 数：168 笔，涉及 100 家门店，amt_total 合计 25,815.47 元、amt_pay 合计 20,567.84 元。位：matcher 按 orders.member_id left join members.member_id
    判空；命中行整行写入 quarantine.csv（record_type=order），raw_json 存 {原列名:原值} 的 JSON object。法：进隔离不进 accepted——导入器 w04_import.py 第 78
    行对 orders 做 left join 后 fail_if 计数非零即 raise UNLINKED_ACCOUNT:orders，留在 accepted 会让整批导入失败。依据：老周 MSG-05310 原话「这类单子本身是系统里的正常订单记录，不是异常数据」「照导出原样加载、不删不改…要不要单独隔离成一张表，你们按核对需要定」→
    隔离属技术选择，不否定其真实性；对账 read 168,253 = accepted 167,749 + quarantined 168 + deduplicated 336（自定待核：落位由契约第 78 行判死，非业务判断）
- rule_id: exact_duplicate_order
  condition: 相邻两行全部 10 列取值完全相同（order_id 相同、其余字段也相同）
  action: deduplicate
  reason_code: EXACT_DUPLICATE
  evidence: 数：336 组，每组恰好 2 行，冗余 336 行；被去重的 336 行状态分布＝已完成 245／已取消 60／全额退款 25／部分退款 6。位：去重保首条（保留 source_row 较小者），被去重行计入 record_counts.order.deduplicated=336，另出
    336 组清单（order_id＋两条 source_row）。法：先 deduplicate 再判 orphan，两组集合实测零重叠（悬挂168与重复组交集0）。依据：契约要求完全重复行去重计deduplicated；本人原访谈未确认来源，现采用课程方QH4-01补充分页导出可能重复，逐组原因仍需日志，不将后补事实回写原访谈。
- rule_id: refund_exceeds_paid
  condition: orders.amt_rfd > orders.amt_pay（退款金额大于实付金额）
  action: keep
  reason_code: REFUND_EXCEEDS_PAID
  evidence: 数：84笔，涉及75家门店、84名会员；37笔退款介于实付与总额之间、47笔超过总额。位：个人实现保留原值打标，Decimal比较，不改数。课程方QH4-03已说明为历史手工补录错误，不能用均匀分布反驳；正确金额须逐笔取凭据。参考checkpoint采用隔离，本人版本采用教师允许的写清影响：全体净销售包含错误负净额，仅供异常核对；有效购买和月度复购按净额大于零排除。不宣称金额已经核正确或与参考库一致。
- rule_id: do_not_contact
  condition: tag 列任意位置包含「勿打电话」或「勿发短信」（包含匹配，非开头匹配）
  action: keep
  reason_code: DO_NOT_CONTACT
  evidence: 数：443人。位：member_notes保留触达限制，按电话/短信各自渠道遵守，未核前不自动执行；不能凭关键词创造全渠道禁令。法：用包含而非开头——实测段级开头匹配420人、整格开头仅266
    人、包含 443 人；用整格开头会漏 177 人，用段级开头会漏 23 人。依据：小林 MSG-05265 第四答「混在中间、前面挂着标签的也一样不能丢」；红线级，漏一条＝给明确说过别打电话的客户打电话
- rule_id: restricted_to_store_only
  condition: tag 列包含「仅保留到店服务」
  action: keep
  reason_code: DO_NOT_UPGRADE_CONTACT
  evidence: 数：13人。位：保留完整备注，单独出现时不自动归为触达限制、不升级为禁联、不设有效期；与已明确的勿打电话/勿发短信分开计数。依据：本人小林访谈仅确认写法，未确认效力。
- rule_id: temporarily_unavailable
  condition: tag 列包含「这阵子不方便接听」
  action: keep
  reason_code: TEMPORARY_UNAVAILABLE
  evidence: 数：6 行次（按出现行计，非人数）。位：只识别、只打标，不升级为禁联、不设有效期。法：按行次统计而非按人去重，因为这是时点性表述。依据：小林访谈确认写法存在但无期限约定（自定待核：有效期未定）
- rule_id: paid_status_anomaly
  condition: ord_stat = '已支付'（区别于「已完成」，付款已完成但后续流程未走完）
  action: keep
  reason_code: SUSPICIOUS_UNFULFILLED
  evidence: 数：229 笔，全部集中在下单日期 2026-08-25~2026-08-31（覆盖期末 7 天），174 家门店，金额 10.18~674.70 元，无退款。位：映射为 status=paid，标记写入旁路清单 order_flags.csv（order_id／reason_code／原
    ord_stat），不进契约 CSV——契约 orders.csv 固定 10 列，加列即 CSV_COLUMNS_MISMATCH。法：不隔离、不改状态——229 笔是真实付款；但集中在期末最后一周这一形态必须在诊断报告点出，避免被当成常规业务量。依据：数据自证分布；ord_stat
    五值语义无法由业务或系统侧确认（自定待核：D7 状态映射）。同段的「全额退款→paid」已按指标库定义定案（valid_order_count 写「取消和全退不计」、full_refund_order_count 要求 status=paid），映射见
    customer/w04/value_mapping.csv
- rule_id: unsupported_card_type
  condition: card_kind 不在六值集合（悦享年卡／悦享卡（年）／家庭季卡／异业联名卡／体验卡／员工卡）之内
  action: quarantine
  reason_code: UNSUPPORTED_CARD_TYPE
  evidence: 数：本批 0 条（六值合计 16,648，与卡表行数一致）。位：命中行进 quarantine，record_type=card。法：本条为后续批次防护，本批不触发。依据：数据自证六值穷举；契约 README 第 69
    行预设该 reason_code。注：员工卡属六值之一，走 card_type=员工内购 映射，不命中本条（陈姐 MSG-05290：员工卡是内购用、不算会员权益、不计付费会员资格）
- rule_id: invalid_date
  condition: 已按三形态解析后仍无法构成 YYYY-MM-DD 合法日期的值
  action: quarantine
  reason_code: INVALID_DATE
  evidence: 数：本批 0 条（join_dt 116,141+1,823+1,790＝119,754 全部可解析；ord_tm 168,253 全 19 位；st_dt／ed_dt 各 16,648 全 ISO10）。位：命中行进
    quarantine，record_type 按来源表填。法：本批不触发，保留用于拦截后续批次。依据：数据自证形态穷举（自定待核：无）
raw_preservation:
  original_files: 4 个 CRM 原始 CSV 与 2 张工作账只读保存，绝不覆盖、绝不手改；SHA-256 与 manifest.json 逐一比对：crm_member_export.csv 119,754／crm_order_export.csv
    168,253／crm_card_export.csv 16,648／crm_shop.csv 403。清洗结果只能由规则重跑得出，任何人工改 CSV 都视为违规
  notes: raw_text 保留整格；note_text 为去掉已识别标签后的完整剩余备注，内部逗号不切分；source_file、source_row、source_field 可追到原始 CSV 记录。
  quarantine: quarantine.csv 每行保留 record_type（member／order／card／shop）、source_file、source_row、reason_code、raw_json（JSON object，键为原始列名、值为原始字符）。隔离不是删除：原行所有字段可在
    raw_json 内完整回溯，不得只存订单号
